[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "A multi-provider streaming LLM client for the terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "openai>=2.0",
  "PyYAML>=6.0.2",
  "rich>=13.9",
  "prompt_toolkit>=3.0.52,<4",
  "textual>=8.2.8,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
mewcode = "mewcode_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode_cli"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["❯"]
